      - name: Prepare site from ZIP
        shell: bash
        run: |
          set -e
          mkdir -p site

          if [ -f opavago-github.zip ]; then
            unzip -o opavago-github.zip -d site
          else
            echo "opavago-github.zip not found in repository root."
            exit 1
          fi

          # Keep vehicle 3D files and uploaded thumbnail assets at the published root.
          for asset in *.glb *.gltf *.bin *.json *.png *.jpg *.jpeg *.webp *.svg; do
            if [ -e "$asset" ]; then
              cp -f "$asset" site/
            fi
          done

          # Also publish the newly uploaded thumbnails to the app image directory.
          mkdir -p site/opavago/img
          for asset in \
            2aae96d2b7.webp \
            59e17e5123.png \
            889ed85934.webp \
            934ed64e97.webp \
            47984c398f.webp \
            c09b980991.png \
            d6d0f29e89.png \
            f6493be873.webp
          do
            if [ -f "$asset" ]; then
              cp -f "$asset" site/
              cp -f "$asset" site/opavago/img/
            fi
          done

          if [ -d opavago ]; then
            cp -R opavago site/
          fi

          if [ -d img ]; then
            cp -R img site/
          fi

          touch site/.nojekyll
