name: Deploy Mhd to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site from ZIP
        shell: bash
        run: |
          set -e
          mkdir -p site

          if [ -f opavago-github.zip ]; then
            unzip -o opavago-github.zip -d site
          else
            echo "opavago-github.zip not found in repository root."
            exit 1
          fi

          # Keep 3D vehicle files and all uploaded asset thumbnails at the site root.
          for asset in *.glb *.gltf *.bin *.json *.png *.jpg *.jpeg *.webp *.svg; do
            if [ -e "$asset" ]; then
              cp -f "$asset" site/
            fi
          done

          # Also keep the thumbnails in the opavago image directory used by the app.
          mkdir -p site/opavago/img
          for asset in \
            2aae96d2b7.webp \
            59e17e5123.png \
            889ed85934.webp \
            934ed64e97.webp \
            47984c398f.webp \
            c09b980991.png \
            d6d0f29e89.png \
            f6493be873.webp
          do
            if [ -f "$asset" ]; then
              cp -f "$asset" site/
              cp -f "$asset" site/opavago/img/
            fi
          done

          if [ -d opavago ]; then
            cp -R opavago site/
          fi

          if [ -d img ]; then
            cp -R img site/
          fi

          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
