name: Deploy Mhd to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site from ZIP
        shell: bash
        run: |
          set -e
          mkdir -p site

          if [ -f opavago-github.zip ]; then
            unzip -o opavago-github.zip -d site
          else
            echo "opavago-github.zip not found in repository root."
            exit 1
          fi

          # Keep vehicle 3D files at the published root so model-viewer can load them
          for asset in *.glb *.gltf *.bin *.json; do
            if [ -e "$asset" ]; then
              cp -f "$asset" site/
            fi
          done

          touch site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
