<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MHD – 3D modely vozidel</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #0d1320;
      --bg-2: #111a2b;
      --panel: rgba(17, 25, 40, 0.88);
      --panel-strong: rgba(10, 14, 24, 0.95);
      --border: rgba(255, 255, 255, 0.08);
      --text: #edf3ff;
      --muted: #aab8d3;
      --accent: #76b6ff;
      --accent-2: #7ef0c4;
      --hover: rgba(118, 182, 255, 0.18);
      --error: #ff7d7d;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      overflow: hidden;
    }

    .layout {
      display: flex;
      width: 100vw;
      height: 100vh;
    }

    .sidebar {
      width: 300px;
      background: var(--panel-strong);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 18px 14px 14px;
      backdrop-filter: blur(10px);
    }

    .brand {
      margin-bottom: 16px;
      padding: 14px 12px 10px;
      border-bottom: 1px solid var(--border);
    }

    .brand h1 {
      margin: 0;
      font-size: 1.35rem;
      letter-spacing: 0.04em;
    }

    .brand small {
      display: inline-block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .model-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
    }

    .model-item {
      width: 100%;
      text-align: left;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
      color: var(--text);
      cursor: pointer;
      padding: 12px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      transition: all 0.2s ease;
      line-height: 1.35;
    }

    .model-item:hover {
      background: var(--hover);
      border-color: rgba(118, 182, 255, 0.5);
      transform: translateX(2px);
    }

    .model-item.active {
      background: linear-gradient(135deg, rgba(118, 182, 255, 0.22), rgba(126, 240, 196, 0.18));
      border-color: rgba(118, 182, 255, 0.8);
      box-shadow: inset 0 0 0 1px rgba(118, 182, 255, 0.25);
    }

    .viewer-area {
      position: relative;
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(10,17,28,0.85), rgba(7,12,20,0.96));
    }

    model-viewer {
      width: 100%;
      flex: 1;
      min-height: 300px;
      background: radial-gradient(circle at top, #1B2E4B 0%, #0f1726 35%, #070c14 100%);
      --progress-bar-color: var(--accent);
      --progress-mask: rgba(255,255,255,0.15);
      --metalness: 0.7;
      --roughness: 0.7;
    }

    .info-bar {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      background: rgba(7, 12, 20, 0.72);
      border: 1px solid var(--border);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      padding: 16px 18px 14px;
      z-index: 10;
    }

    .info-bar h2 {
      margin: 0 0 8px;
      font-size: clamp(1rem, 1.5vw, 1.5rem);
      color: var(--accent-2);
    }

    .meta {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.6;
      word-break: break-word;
    }

    .controls {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      background: rgba(7, 12, 20, 0.78);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 18px;
      color: var(--text);
      font-size: 0.8rem;
      letter-spacing: 0.02em;
      z-index: 10;
      white-space: nowrap;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(7, 12, 20, 0.55);
      z-index: 15;
    }

    .loading.show {
      display: flex;
    }

    .spinner-box {
      background: rgba(17,25,40,0.9);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px 30px;
      text-align: center;
    }

    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 10px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error {
      color: var(--error);
      padding: 10px 12px;
      border: 1px solid rgba(255, 125, 125, 0.35);
      background: rgba(255, 125, 125, 0.08);
      border-radius: 8px;
      margin-top: 10px;
    }

    @media (max-width: 920px) {
      body {
        overflow: auto;
      }

      .layout {
        display: block;
        height: auto;
        min-height: 100vh;
      }

      .sidebar {
        width: 100%;
        height: auto;
        max-height: none;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      .viewer-area {
        min-height: 70vh;
      }

      .controls {
        white-space: normal;
        text-align: center;
        max-width: calc(100% - 40px);
      }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>3D MHD</h1>
        <small>Vozový park</small>
      </div>
      <div id="modelList" class="model-list">
        <div class="meta">Načítám modely…</div>
      </div>
    </aside>

    <main class="viewer-area">
      <div class="info-bar">
        <h2 id="modelName">Vyberte model</h2>
        <div id="modelMeta" class="meta">-</div>
      </div>

      <model-viewer
        id="viewer"
        alt="3D model vozidla"
        camera-controls
        auto-rotate
        interaction-prompt="auto"
        shadow-intensity="1"
        disable-tap
      ></model-viewer>

      <div class="controls">🖱️ Otáčejte myší | 🔍 Přibližujte kolečkem</div>

      <div id="loading" class="loading">
        <div class="spinner-box">
          <div class="spinner"></div>
          <div>Načítám model…</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const viewer = document.getElementById('viewer');
    const modelList = document.getElementById('modelList');
    const modelName = document.getElementById('modelName');
    const modelMeta = document.getElementById('modelMeta');
    const loading = document.getElementById('loading');

    let models = [];
    let currentIndex = 0;

    function getModelUrl(fileName) {
      return `https://cdn.jsdelivr.net/gh/prerekhu-cloud/Mhd@main/${fileName}`;
    }

    function formatFileName(name) {
      return name
        .replace(/\.(glb|GLB)$/i, '')
        .replace(/[_-]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function renderList() {
      if (!models.length) {
        modelList.innerHTML = '<div class="error">Žádné GLB modely nebyly nalezeny.</div>';
        return;
      }

      modelList.innerHTML = models.map((model, index) => `
        <button class="model-item ${index === currentIndex ? 'active' : ''}" data-index="${index}" title="${model.name}">
          ${model.label}
        </button>
      `).join('');

      document.querySelectorAll('.model-item').forEach((button) => {
        button.addEventListener('click', () => {
          loadModel(Number(button.dataset.index));
        });
      });
    }

    function loadModel(index) {
      const model = models[index];
      if (!model) return;

      currentIndex = index;
      renderList();

      loading.classList.add('show');
      modelName.textContent = model.label;
      modelMeta.textContent = `Soubor: ${model.name} • Velikost: ${model.size} MB`;
      viewer.src = getModelUrl(model.path);

      const onLoad = () => {
        loading.classList.remove('show');
        viewer.removeEventListener('load', onLoad);
      };

      viewer.addEventListener('load', onLoad, { once: true });
    }

    async function loadModels() {
      try {
        const response = await fetch('https://api.github.com/repos/prerekhu-cloud/Mhd/contents/');
        if (!response.ok) throw new Error(`GitHub API error: ${response.status}`);

        const data = await response.json();

        models = data
          .filter(file => file.type === 'file' && file.name.toLowerCase().endsWith('.glb'))
          .map(file => ({
            name: file.name,
            path: file.path,
            label: formatFileName(file.name),
            size: (file.size / 1024 / 1024).toFixed(2)
          }))
          .sort((a, b) => a.name.localeCompare(b.name, 'cs'));

        if (!models.length) {
          modelList.innerHTML = '<div class="error">V repozitáři nebyly nalezeny žádné GLB modely.</div>';
          return;
        }

        renderList();
        loadModel(0);
      } catch (error) {
        console.error(error);
        modelList.innerHTML = `<div class="error">Chyba při načítání modelů: ${error.message}</div>`;
      }
    }

    loadModels();
  </script>
</body>
</html>
