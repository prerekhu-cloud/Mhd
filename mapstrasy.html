<script>

// ===== Configuration =====

const MAPBOX_TOKEN = 'pk.eyJ1IjoicHJlcmVraHUiLCJhIjoiY210MTdrdGdkMGF4NTJ5cXRmajZuYnZ4diJ9.cYutpkeP6s0XVyubG68_6Q';

const MAPTRAS_URL = 'https://media.base44.com/files/public/user_6a6de6204690e6d3b939a064/032257e9b_maptras1.html';

const VEHICLE_MODELS = {
    Irisbus: 'https://github.com/prerekhu-cloud/Mhd/raw/refs/heads/main/Irisbus.glb',
    '26TR': 'https://github.com/prerekhu-cloud/Mhd/raw/refs/heads/main/26tr.glb',
    Sorelektro: 'https://github.com/prerekhu-cloud/Mhd/raw/refs/heads/main/Sorelektro.glb',
    Iveco12m: 'https://github.com/prerekhu-cloud/Mhd/raw/refs/heads/main/Iveco12m.glb',
    Sorbus: 'https://github.com/prerekhu-cloud/Mhd/raw/refs/heads/main/Sorbus.glb',
    '32TR': 'https://github.com/prerekhu-cloud/Mhd/raw/refs/heads/main/32tropava.glb',
    Iveco10m: 'https://github.com/prerekhu-cloud/Mhd/raw/refs/heads/main/Iveco10m.glb',
};




// ===== State =====

let map = null;

let vehicleLayer = null;

let routes = [];

let animationId = null;

let is3D = true;

let showVehicles = true;

let riding = false;

let rideState = { active: false, vehicle: null, speed: 30 };

let selectedRoute = null;

let selectedVehicle = 'Irisbus';

let speed = 30;


// ===== Helpers =====

function $(id) { return document.getElementById(id); }


function showError(msg) {

$('loader').style.display = 'none';

$('error-msg').textContent = msg;

$('error-screen').style.display = 'flex';

}


function hideLoader() {

$('loader').style.display = 'none';

$('header').style.display = 'flex';

$('ride-setup').style.display = 'block';

$('info-hint').style.display = 'block';

}


// ===== Route loading =====

async function loadOpavaRoutes() {

const response = await fetch(MAPTRAS_URL);

const html = await response.text();


const scriptMatches = html.match(/<script[^>]*>([\s\S]*?)<\/script>/gi) || [];

const allScript = scriptMatches.map(s => s.replace(/<\/?script[^>]*>/gi, '')).join('\n');


const result = [];

for (let i = 1; i <= 40; i++) {

const declStr = `const coordinatesTrasa${i} = `;

const startIdx = allScript.indexOf(declStr);

if (startIdx === -1) continue;


const arrayStart = allScript.indexOf('[', startIdx);

if (arrayStart === -1) continue;


let depth = 0;

let end = arrayStart;

for (let j = arrayStart; j < allScript.length; j++) {

if (allScript[j] === '[') depth++;

if (allScript[j] === ']') {

depth--;

if (depth === 0) { end = j + 1; break; }

}

}

const arrayStr = allScript.substring(arrayStart, end);

try {

const coords = JSON.parse(arrayStr);

if (Array.isArray(coords) && coords.length > 1) {

result.push({ id: i, name: `Trasa ${i}`, coordinates: coords });

}

} catch (e) { /* skip */ }

}

return result;

}


// ===== VehicleLayer3D (Three.js custom Mapbox layer) =====

class VehicleLayer3D {

constructor(id) {

this.id = id;

this.type = 'custom';

this.renderingMode = '3d';

this.vehicles = [];

this.modelCache = new Map();

}


onAdd(map, gl) {

this.map = map;

this.gl = gl;


const THREE = window.THREE;

if (!THREE) return;


this.camera = new THREE.PerspectiveCamera(60, 1, 0.1, 1e15);

this.scene = new THREE.Scene();


const ambient = new THREE.AmbientLight(0xffffff, 0.75);

const directional = new THREE.DirectionalLight(0xffffff, 0.5);

directional.position.set(0.5, -0.5, 1);

this.scene.add(ambient, directional);


this.renderer = new THREE.WebGLRenderer({

canvas: map.getCanvas(),

context: gl,

antialias: true,

});

this.renderer.autoClear = false;


this.vehicles.forEach(v => this._loadModel(v));

}


_loadModel(vehicle) {

const THREE = window.THREE;

if (!THREE || !THREE.GLTFLoader) {

setTimeout(() => this._loadModel(vehicle), 200);

return;

}

if (this.modelCache.has(vehicle.modelUrl)) {

const model = this.modelCache.get(vehicle.modelUrl).clone();

vehicle.mesh = model;

this.scene.add(model);

vehicle.loaded = true;

return;

}

const loader = new THREE.GLTFLoader();

loader.load(

vehicle.modelUrl,

(gltf) => {

const model = gltf.scene;

this.modelCache.set(vehicle.modelUrl, model);

const clone = model.clone();

vehicle.mesh = clone;

this.scene.add(clone);

vehicle.loaded = true;

},

undefined,

(err) => console.error('Model load failed:', vehicle.modelUrl, err)

);

}


addVehicle({ modelUrl, routeCoords, speed = 20, scale = 1, name = 'Vehicle' }) {

const vehicle = {

modelUrl, routeCoords,

distance: Math.random() * this._routeLength(routeCoords),

speed, scale, name,

mesh: null, loaded: false,

currentLng: routeCoords[0][0],

currentLat: routeCoords[0][1],

currentBearing: 0,

};

this.vehicles.push(vehicle);

if (this.scene) this._loadModel(vehicle);

return vehicle;

}


_routeLength(coords) {

const turf = window.turf;

if (!turf) return coords.length * 50;

try {

const line = turf.lineString(coords.map(c => [c[0], c[1]]));

return turf.length(line, { units: 'meters' });

} catch { return coords.length * 50; }

}


_getPositionAlongRoute(coords, distanceMeters) {

const turf = window.turf;

if (!turf) return null;

try {

const line = turf.lineString(coords.map(c => [c[0], c[1]]));

const totalLen = turf.length(line, { units: 'meters' });

let dist = distanceMeters % totalLen;

if (dist < 0) dist += totalLen;

const pt = turf.along(line, dist, { units: 'meters' });

const next = turf.along(line, (dist + 8) % totalLen, { units: 'meters' });

const bearing = turf.bearing(pt, next);

const frac = dist / totalLen;

const idx = Math.floor(frac * (coords.length - 1));

const alt = coords[idx] ? coords[idx][2] || 260 : 260;

return { lng: pt.geometry.coordinates[0], lat: pt.geometry.coordinates[1], bearing, alt };

} catch { return null; }

}


update(deltaTime) {

const THREE = window.THREE;

if (!THREE || !this.map) return;


for (const v of this.vehicles) {

if (!v.loaded || !v.mesh) continue;


v.distance += v.speed * deltaTime;

const pos = this._getPositionAlongRoute(v.routeCoords, v.distance);

if (!pos) continue;


v.currentLng = pos.lng;

v.currentLat = pos.lat;

v.currentBearing = pos.bearing;


const mc = window.mapboxgl.MercatorCoordinate.fromLngLat([pos.lng, pos.lat], pos.alt + 1.5);

v.mesh.position.set(mc.x, mc.y, mc.z);


const s = v.scale * mc.meterInMercatorUnits;

v.mesh.scale.set(s, s, s);


v.mesh.rotation.set(Math.PI / 2, 0, (-pos.bearing * Math.PI) / 180);

}


this.map.triggerRepaint();

}


render(gl, matrix) {

const THREE = window.THREE;

if (!THREE || !this.renderer || !this.vehicles.some(v => v.loaded)) return;


const m = new THREE.Matrix4().fromArray(matrix);

const l = new THREE.Matrix4().makeScale(1, -1, 1);

this.camera.projectionMatrix = new THREE.Matrix4().multiplyMatrices(m, l);

this.camera.projectionMatrixInverse.copy(this.camera.projectionMatrix).invert();


this.renderer.resetState();

this.renderer.render(this.scene, this.camera);

}


remove() {

if (this.renderer) this.renderer.dispose();

this.vehicles.forEach(v => {

if (v.mesh && this.scene) this.scene.remove(v.mesh);

});

}

}


// ===== Init =====

function initMap() {

if (!window.mapboxgl) {

showError('Mapbox GL JS se nenačetl. Zkuste obnovit stránku.');

return;

}


window.mapboxgl.accessToken = MAPBOX_TOKEN;


map = new window.mapboxgl.Map({

container: 'map',

style: 'mapbox://styles/mapbox/standard',

center: [17.9025, 49.9387],

zoom: 16,

pitch: 60,

bearing: 0,

antialias: true,

});


map.on('style.load', () => {

try {

if (!map.getSource('mapbox-dem')) {

map.addSource('mapbox-dem', {

type: 'raster-dem',

url: 'mapbox://mapbox.mapbox-terrain-dem-v1',

tileSize: 512,

maxzoom: 14,

});

map.setTerrain({ source: 'mapbox-dem', exaggeration: 1.5 });

}

} catch (e) { /* terrain already present */ }


try {

const layers = map.getStyle().layers;

const labelLayerId = layers.find(

l => l.type === 'symbol' && l.layout && l.layout['text-field']

)?.id;


if (labelLayerId && !map.getLayer('add-3d-buildings')) {

if (map.getStyle().sources['composite']) {

map.addLayer({

id: 'add-3d-buildings',

source: 'composite',

'source-layer': 'building',

filter: ['==', 'extrude', 'true'],

type: 'fill-extrusion',

minzoom: 13,

paint: {

'fill-extrusion-color': '#aaa',

'fill-extrusion-opacity': 0.9,

'fill-extrusion-height': ['get', 'height'],

'fill-extrusion-base': ['get', 'min_height'],

},

}, labelLayerId);

}

}

} catch (e) { /* buildings already 3D */ }

});


map.on('load', async () => {

try {

routes = await loadOpavaRoutes();


// Populate route dropdown

const selRoute = $('sel-route');

routes.forEach(r => {

const opt = document.createElement('option');

opt.value = r.id;

opt.textContent = r.name;

selRoute.appendChild(opt);

});


// Populate vehicle dropdown

const selVehicle = $('sel-vehicle');

Object.keys(VEHICLE_MODELS).forEach(v => {

const opt = document.createElement('option');

opt.value = v;

opt.textContent = v;

selVehicle.appendChild(opt);

});


$('route-info').textContent = `${routes.length} tras · ${Object.keys(VEHICLE_MODELS).length} typů vozidel`;


// Add routes to map

const features = routes.map(r => ({

type: 'Feature',

properties: { id: r.id, name: r.name },

geometry: { type: 'LineString', coordinates: r.coordinates },

}));


if (!map.getSource('all-routes')) {

map.addSource('all-routes', {

type: 'geojson',

data: { type: 'FeatureCollection', features },

});


map.addLayer({

id: 'routes-layer',

type: 'line',

source: 'all-routes',

slot: 'middle',

layout: { 'line-join': 'round', 'line-cap': 'round' },

paint: {

'line-color': '#E2725B',

'line-width': 4,

'line-opacity': 0.8,

},

});

}


// Add vehicle layer

vehicleLayer = new VehicleLayer3D('vehicle-models');

map.addLayer(vehicleLayer);


// Add vehicles

const modelKeys = Object.keys(VEHICLE_MODELS);

routes.forEach((route, idx) => {

if (idx >= 12) return;

const modelKey = modelKeys[idx % modelKeys.length];

vehicleLayer.addVehicle({

modelUrl: VEHICLE_MODELS[modelKey],

routeCoords: route.coordinates,

speed: 15 + Math.random() * 15,

scale: 1.5,

name: `${modelKey} – ${route.name}`,

});

});


// Animation loop

let lastTime = performance.now();

const animate = (time) => {

const delta = (time - lastTime) / 1000;

lastTime = time;


if (vehicleLayer) {

vehicleLayer.update(delta);


if (rideState.active && rideState.vehicle) {

const v = rideState.vehicle;

if (v.loaded && v.mesh) {

const bearing = v.currentBearing;

const offsetDist = 0.0003;

const angleRad = (bearing * Math.PI) / 180;

const offsetLng = -Math.sin(angleRad) * offsetDist;

const offsetLat = -Math.cos(angleRad) * offsetDist;


map.jumpTo({

center: [v.currentLng + offsetLng, v.currentLat + offsetLat],

zoom: 18,

pitch: 70,

bearing: bearing,

});

}

}

}


animationId = requestAnimationFrame(animate);

};

animationId = requestAnimationFrame(animate);


hideLoader();

} catch (err) {

console.error(err);

showError('Nepodařilo se načíst data tras: ' + err.message);

}

});

}


// ===== Controls =====

function toggle3D() {

if (!map) return;

if (is3D) {

map.easeTo({ pitch: 0, zoom: 14 });

$('btn-3d').textContent = '◆ 3D pohled';

} else {

map.easeTo({ pitch: 60, zoom: 16 });

$('btn-3d').textContent = '◘ 2D pohled';

}

is3D = !is3D;

}


function toggleVehicles() {

if (!vehicleLayer) return;

if (showVehicles) {

vehicleLayer.vehicles.forEach(v => {

if (v.mesh) vehicleLayer.scene.remove(v.mesh);

});

$('btn-vehicles').textContent = '🚌 Vozidla OFF';

$('btn-vehicles').classList.remove('active');

} else {

vehicleLayer.vehicles.forEach(v => {

if (v.mesh) vehicleLayer.scene.add(v.mesh);

});

$('btn-vehicles').textContent = '🚌 Vozidla ON';

$('btn-vehicles').classList.add('active');

}

showVehicles = !showVehicles;

}


function startRide() {

if (!vehicleLayer || vehicleLayer.vehicles.length === 0) return;


let vehicle;

if (selectedRoute != null) {

const route = routes.find(r => r.id === selectedRoute);

if (route) {

vehicle = vehicleLayer.vehicles.find(v => v.routeCoords === route.coordinates);

if (!vehicle) {

vehicle = vehicleLayer.addVehicle({

modelUrl: VEHICLE_MODELS[selectedVehicle] || VEHICLE_MODELS.Irisbus,

routeCoords: route.coordinates,

speed,

scale: 1.5,

name: `${selectedVehicle} – ${route.name}`,

});

}

}

}

if (!vehicle) {

vehicle = vehicleLayer.vehicles[Math.floor(Math.random() * vehicleLayer.vehicles.length)];

}

if (!vehicle) return;


if (VEHICLE_MODELS[selectedVehicle] && vehicle.modelUrl !== VEHICLE_MODELS[selectedVehicle]) {

vehicle.modelUrl = VEHICLE_MODELS[selectedVehicle];

vehicle.loaded = false;

if (vehicle.mesh) {

vehicleLayer.scene.remove(vehicle.mesh);

vehicle.mesh = null;

}

vehicleLayer._loadModel(vehicle);

}


vehicle.speed = speed;

rideState = { active: true, vehicle, speed };

riding = true;


$('ride-setup').style.display = 'none';

$('info-hint').style.display = 'none';

$('ride-active').style.display = 'block';

$('btn-stop').style.display = 'flex';

$('ride-vehicle-name').textContent = vehicle.name || 'Vozidlo';

$('ride-speed-num').textContent = speed;

}


function stopRide() {

rideState.active = false;

riding = false;

$('ride-active').style.display = 'none';

$('btn-stop').style.display = 'none';

$('ride-setup').style.display = 'block';

$('info-hint').style.display = 'block';

if (map) map.easeTo({ pitch: 60, zoom: 16 });

}


function restartRide() {

if (rideState.vehicle) {

rideState.vehicle.distance = 0;

}

}


function changeSpeed(delta) {

speed = Math.max(5, Math.min(100, speed + delta));

$('ride-speed-num').textContent = speed;

$('speed-display').textContent = speed + ' km/h';

$('speed-range').value = speed;

rideState.speed = speed;

if (rideState.vehicle) {

rideState.vehicle.speed = speed;

}

}


// ===== Wire up events =====

$('btn-3d').addEventListener('click', toggle3D);

$('btn-vehicles').addEventListener('click', toggleVehicles);

$('btn-start').addEventListener('click', startRide);

$('btn-stop').addEventListener('click', stopRide);

$('btn-restart').addEventListener('click', restartRide);

$('btn-slower').addEventListener('click', () => changeSpeed(-5));

$('btn-faster').addEventListener('click', () => changeSpeed(5));


$('sel-vehicle').addEventListener('change', (e) => { selectedVehicle = e.target.value; });

$('sel-route').addEventListener('change', (e) => {

selectedRoute = e.target.value ? parseInt(e.target.value) : null;

});

$('speed-range').addEventListener('input', (e) => {

speed = parseInt(e.target.value);

$('speed-display').textContent = speed + ' km/h';

});


// ===== Start =====

initMap();

</script>
