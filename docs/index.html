<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1">
<title>MHD Opava – současná síť</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Outfit,sans-serif}body{background:#f0e8e1;color:#333;padding:12px;overflow:hidden}.pill-shadow{box-shadow:0 2px 8px rgba(0,0,0,.06)}.map-shadow{box-shadow:0 12px 40px rgba(36,30,26,.06)}
.leaflet-container{background:transparent}
.leaflet-control-zoom{border:0!important;box-shadow:0 4px 12px rgba(0,0,0,.08)!important;border-radius:12px!important;overflow:hidden}.leaflet-control-zoom-in,.leaflet-control-zoom-out{background:#fff;border:0;padding:0;width:40px;height:40px}
.network-panel{position:fixed;top:78px;right:18px;width:min(430px,calc(100vw - 36px));max-height:calc(100vh - 96px);z-index:3000;display:none;flex-direction:column;background:rgba(250,247,243,.98);border:1px solid #e7ded5;border-radius:22px;box-shadow:0 22px 55px rgba(0,0,0,.12);overflow:hidden}
.stop-map-marker{background:transparent!important;border:0!important}.stop-pin{width:14px;height:14px;border:2px solid #C1784F;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.28)}.stop-pin.request{background:#f8efe6}
.theme-status{position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:1100;background:rgba(35,31,28,.92);color:#fff;padding:8px 14px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,.06)}
body.dark{background:#151413;color:#eee}body.dark header{background:#201f1d!important;border-color:#37332f!important}body.dark header h1,body.dark .mode-text{color:#eee!important}body.dark .map-shell{background:#201f1d}

/* Vyhledávání / Spojení */
.search-panel{position:fixed;left:22px;top:315px;width:340px;max-width:calc(100vw - 44px);z-index:3200;background:rgba(250,247,243,.97);border:1px solid #e7ded5;border-radius:22px;box-shadow:0 20px 55px rgba(0,0,0,.08);display:none}
.search-panel.open{display:block}.search-tabs{display:grid;grid-template-columns:1fr 1fr;padding:7px;border-bottom:1px solid #eee5dc;gap:5px}.search-tab{border:0;background:transparent;border-radius:12px;padding:7px;font-weight:700;color:#8a7f75}.search-tab.active{background:#C1784F;color:#fff}
@media(max-width:700px){.search-panel{left:12px;top:88px;width:calc(100vw - 24px);max-height:calc(100vh - 105px);overflow:auto}}
</style>

<style>
.opava-stop-marker{background:transparent!important;border:0!important}.opava-stop-icon{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid #C1784F;box-shadow:0 1px 5px rgba(0,0,0,.18)}
</style>

<link href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.1.0/turf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>

<style>
#mapbox3d{z-index:1;background:#d9e1e6}#map{z-index:0}.mapboxgl-map{font-family:Outfit,sans-serif}.mapboxgl-ctrl-bottom-right{display:none}.mapboxgl-ctrl-bottom-left{display:none}
.ride-start{position:absolute;left:22px;bottom:22px;z-index:1200;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:18px;background:rgba(250,247,243,.96);border:1px solid #e7ded5}
body.dark .ride-start,body.dark .ride-panel,body.dark .ride-control-card{background:rgba(28,27,25,.96);border-color:#3a3734;color:#eee}
@media(max-width:700px){.ride-start{left:12px;right:12px;bottom:12px}.ride-start-hint{display:none}.ride-panel{left:12px;top:84px}.ride-controls{right:12px;top:auto;bottom:72px;width:270px}}
</style>
<style>
.stop-pop{font-family:inherit;min-width:190px}
.stop-pop .sp-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stop-pop .sp-name{font-weight:700;font-size:14px;color:#3d342d}
.stop-pop .sp-req{display:inline-flex;align-items:center;gap:4px;background:#F3E4D7;color:#A65A2E;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.stop-pop .sp-meta{font-size:11px;color:#8a7f75;margin-top:3px}
.stop-pop .sp-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#a2968b;margin:8px 0 4px}
.stop-pop .sp-lines{display:flex;flex-wrap:wrap;gap:4px}
.sp-line{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:22px;padding:0 7px;border-radius:6px;background:#C1784F;color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.sp-line:hover{background:#A65A2E}
.sp-empty{font-size:11px;color:#a2968b}
.sp-req-ico{color:#C1784F;font-size:11px}
.hl-pin{width:30px;height:30px;border-radius:50%;background:#2F6F4E;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.3);border:2px solid #fff}
.hl-badge{width:24px;height:24px;border-radius:50%;background:#C1784F;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.hl-address-row{display:flex;align-items:center;gap:8px;font-size:12px;color:#3d342d;background:#EFE6DC;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.nearest-lines{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.nearest-row{align-items:flex-start!important}
.conn-facts{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#6f645b;margin:6px 0}
.conn-step{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:10px;background:#F5EFE9;margin:6px 0;font-size:12px;color:#3d342d}
.conn-step i{color:#2F6F4E;margin-top:2px}
.conn-sub{font-size:11px;color:#8a7f75}
.leg-time{margin-left:auto;font-size:11px;color:#8a7f75}
.rt-dot{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.rt-dot.a{background:#2F6F4E}.rt-dot.b{background:#A63D2E}.rt-dot.start,.rt-dot.end{background:#3d342d}
body.dark .stop-pop .sp-name{color:#f5efe9}
body.dark .conn-step{background:#26231f;color:#e9e1d8}
.mapboxgl-popup-content{border-radius:12px;padding:12px 14px}
body.dark .mapboxgl-popup-content{background:#211f1c;color:#efe7de}
body.dark .mapboxgl-popup-tip{border-top-color:#211f1c;border-bottom-color:#211f1c}
</style>

<style>
/* ==================== GARÁŽ VOZIDEL – kompaktní, posuvná a dotykově přívětivá ==================== */
#garage-panel{
  position:absolute;left:12px;right:12px;top:12px;
  height:min(90%,760px);max-height:calc(100% - 24px);
  z-index:1250;display:none;flex-direction:column;
  background:rgba(250,247,243,.975);border:1px solid #e7ded5;border-radius:28px;
  box-shadow:0 22px 65px rgba(0,0,0,.18);backdrop-filter:blur(24px);overflow:hidden;
}
#garage-panel.open{display:flex}
.garage-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid #eee5dc;flex:0 0 auto}
.garage-title-wrap{display:flex;align-items:center;gap:12px;min-width:0}.garage-icon{width:38px;height:38px;border-radius:50%;background:#C1784F;color:#fff;display:flex;align-items:center;justify-content:center}
.garage-eyebrow{font-size:9px;letter-spacing:.18em;font-weight:700;color:#a98b78;text-transform:uppercase}.garage-title{margin:1px 0 0;font-size:18px;font-weight:700;color:#302b27}.garage-subtitle{font-size:12px;color:#8a7f75;margin-top:2px}
.garage-active{background:#C1784F!important;color:#fff!important;border-color:#C1784F!important}.garage-active .fa-chevron-down{transform:rotate(180deg)}
.garage-close{width:34px;height:34px;border-radius:50%;border:1px solid #e4dbd3;background:#fff;color:#777;cursor:pointer;flex:0 0 auto}.garage-close:hover{background:#f7efe8}
.garage-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:12px 16px 20px;-webkit-overflow-scrolling:touch;scrollbar-gutter:stable}
.garage-section-title{display:flex;align-items:center;gap:8px;margin:4px 2px 8px;font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:#756b64}
.garage-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px;align-items:stretch}
.garage-card{min-width:0;border:1px solid #e7ded5;background:rgba(255,255,255,.88);border-radius:17px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,.035);transition:transform .18s,box-shadow .18s}
.garage-model{height:142px;min-height:142px;background:linear-gradient(180deg,#74757c 0%,#adaeb3 100%);position:relative;overflow:hidden;touch-action:none}.garage-model model-viewer{width:100%;height:100%;background:transparent}
.garage-model-badge{position:absolute;left:9px;top:8px;z-index:2;padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.84);color:#6d625b;font-size:8px;font-weight:700}
.garage-card-info{padding:10px 11px 11px;flex:1;display:flex;flex-direction:column}.garage-card-name{font-size:12px;font-weight:700;line-height:1.18;color:#302b27;min-height:28px}
body.dark #garage-panel{background:rgba(27,26,24,.97);border-color:#3a3734}body.dark .garage-head{border-color:#3a3734}body.dark .garage-title,body.dark .garage-card-name{color:#f1ebe5}
@media(max-width:1000px){.garage-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){#garage-panel{top:8px;left:8px;right:8px;height:88%;max-height:calc(100% - 16px);border-radius:22px}.garage-head{padding:14px 14px 11px}.garage-body{padding:10px 10px 18px}}
</style>

</head>
<body class="flex flex-col h-screen w-screen select-none">
<header class="w-full rounded-full px-4 py-2.5 mb-3 flex items-center justify-between pill-shadow border bg-[#FAF6F0] border-[#EBE3DB]">
<div class="flex items-center gap-3"><div class="w-9 h-9 rounded-full bg-[#C1784F] flex items-center justify-center text-white font-bold"><svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/></svg></div>
<div class="flex items-center gap-1.5 md:gap-2"><button id="btn-lang" class="w-9 h-9 rounded-full bg-white/80 flex items-center justify-center text-gray-600 border border-gray-100" title="Jazyk / Lang">CS</button></div></div>
</header>

<!-- VYHLEDÁVÁNÍ -->
<aside id="search-panel" class="search-panel" aria-hidden="true">
  <div class="search-tabs">
    <button id="search-tab-stops" class="search-tab active"><i class="fa-solid fa-location-dot"></i> Zastávky</button>
    <button id="search-tab-connection" class="search-tab"><i class="fa-solid fa-route"></i> Spojení</button>
  </div>
  <div id="search-stops-view" class="search-content">
    <div class="search-head"><div class="search-title">Najít nejbližší zastávky</div><button id="search-close-1" class="search-close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="search-field"><i class="fa-solid fa-location-dot"></i><input id="stop-address" placeholder="Adresa nebo místo v Opavě"><button id="stop-my-location" class="search-loc" title="Moje poloha">My</button></div>
    <button id="find-nearest" class="search-action"><i class="fa-solid fa-magnifying-glass"></i> Najít 3 nejbližší zastávky</button>
    <div id="nearest-status" class="search-status"></div>
    <div id="nearest-results"></div>
  </div>
  <div id="search-connection-view" class="search-content" style="display:none">
    <div class="search-head"><div class="search-title">Vyhledat spojení</div><button id="search-close-2" class="search-close"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="search-field"><i class="fa-regular fa-circle"></i><input id="from-address" placeholder="Odkud – adresa nebo místo"><button id="from-my-location" class="search-loc" title="Moje poloha">My</button></div>
    <div class="search-field"><i class="fa-solid fa-location-dot"></i><input id="to-address" placeholder="Kam – adresa nebo místo"><button id="to-my-location" class="search-loc" title="Moje poloha">My</button></div>
    <button id="swap-search" class="search-secondary"><i class="fa-solid fa-arrow-right-arrow-left"></i> Prohodit</button>
    <button id="find-connection" class="search-action"><i class="fa-solid fa-route"></i> Najít spojení</button>
    <div id="connection-status" class="search-status"></div>
    <div id="connection-results"></div>
  </div>
</aside>


<!-- GARÁŽ VOZIDEL -->
<aside id="garage-panel" aria-hidden="true">
  <div class="garage-head">
    <div class="garage-title-wrap">
      <div class="garage-icon"><i class="fa-solid fa-warehouse"></i></div>
      <div>
        <div class="garage-eyebrow">MHD OPAVA</div>
        <div class="garage-title">Vozový park</div>
        <div class="garage-subtitle">Skutečné modely vozidel načítané z GitHub Pages</div>
      </div>
    </div>
    <button id="garage-close" class="garage-close" title="Zavřít garáž"><i class="fa-solid fa-xmark"></i></button>
  </div>
  <div class="garage-body">
    <div class="garage-section-title"><i class="fa-solid fa-bolt"></i> Trolejbusy</div>
    <div class="garage-grid">
      <article class="garage-card" data-vehicle="26tr">
        <div class="garage-model"><span class="garage-model-badge">TROLEJBUS</span><model-viewer src="https://prerekhu-cloud.github.io/Mhd/26tr.glb" camera-controls auto-rotate rotation-per-second="8deg"></model-viewer></div>
        <div class="garage-card-info"><div class="garage-card-name">Škoda 26Tr Solaris</div><div class="garage-card-type">Nízkopodlažní trolejbus</div></div>
      </article>
      <article class="garage-card" data-vehicle="32tr">
        <div class="garage-model"><span class="garage-model-badge">TROLEJBUS</span><model-viewer src="https://prerekhu-cloud.github.io/Mhd/32tr.glb" camera-controls auto-rotate rotation-per-second="8deg"></model-viewer></div>
        <div class="garage-card-info"><div class="garage-card-name">Škoda 32Tr SOR</div><div class="garage-card-type">Nízkopodlažní trolejbus</div></div>
      </article>
    </div>

    <div class="garage-section-title"><i class="fa-solid fa-bus"></i> Autobusy</div>
    <div class="garage-grid">
      <article class="garage-card" data-vehicle="irisbus">
        <div class="garage-model"><span class="garage-model-badge">AUTOBUS</span><model-viewer src="https://prerekhu-cloud.github.io/Mhd/Irisbus.glb" camera-controls auto-rotate rotation-per-second="8deg"></model-viewer></div>
        <div class="garage-card-info"><div class="garage-card-name">Irisbus Citelis 12M</div><div class="garage-card-type">Nízkopodlažní autobus</div></div>
      </article>
    </div>
  </div>
</aside>

<main class="relative flex-1 w-full rounded-2xl md:rounded-3xl overflow-hidden map-shadow border border-[#EBE3DB] bg-[#FAF7F3] map-shell"><div id="map" class="w-full h-full"></div><div id="mapbox3d" class="hidden absolute inset-0"></div></main>

</script>
</body>
</html>
